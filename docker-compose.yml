version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uptimehub-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: uptimehub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uptimehub
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: uptimehub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

